<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 뭐 먹지? 🍽️</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
  <style>
    :root {
      --cream: #fff8ec;
      --card: #ffffff;
      --orange: #ff8a3d;
      --orange-dark: #e8691a;
      --orange-soft: #ffe7d3;
      --text: #4a3426;
      --muted: #8a7364;
      --line: #f3dcc6;
      --shadow: 0 6px 18px rgba(232, 105, 26, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      overflow-x: hidden;
    }

    body {
      background: var(--cream);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    /* ---------- 헤더 ---------- */
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo {
      font-size: 52px;
      line-height: 1;
      display: inline-block;
      animation: bob 2.4s ease-in-out infinite;
    }
    h1 {
      margin: 8px 0 4px;
      font-size: 1.8rem;
      color: var(--orange-dark);
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* ---------- 조건 선택 카드 ---------- */
    .panel {
      background: var(--card);
      border-radius: 24px;
      padding: 20px 18px;
      box-shadow: var(--shadow);
      border: 2px solid var(--line);
    }

    fieldset {
      border: none;
      margin: 0 0 18px;
      padding: 0;
      min-width: 0;
    }
    legend {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 10px;
      padding: 0;
    }
    legend .now {
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--orange-dark);
      background: var(--orange-soft);
      border-radius: 999px;
      padding: 2px 10px;
      margin-left: 6px;
      white-space: nowrap;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip { position: relative; }
    .chip input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .chip span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 44px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid var(--line);
      background: #fffdf9;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, transform 0.1s, color 0.15s;
    }
    .chip span:hover { border-color: var(--orange); }
    .chip input:checked + span {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
      box-shadow: 0 3px 8px rgba(255, 138, 61, 0.35);
    }
    .chip input:checked + span::before {
      content: "✓";
      font-weight: 800;
    }
    .chip input:focus-visible + span {
      outline: 3px solid var(--orange-dark);
      outline-offset: 2px;
    }
    .chip span:active { transform: scale(0.96); }

    /* ---------- 버튼 ---------- */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      min-height: 52px;
      border-radius: 999px;
      border: none;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible {
      outline: 3px solid var(--orange-dark);
      outline-offset: 3px;
    }
    .btn-main {
      background: var(--orange);
      color: #fff;
      box-shadow: 0 5px 0 var(--orange-dark);
    }
    .btn-main:hover { background: #ff7a24; }
    .btn-sub {
      background: var(--orange-soft);
      color: var(--orange-dark);
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 2px dashed var(--line);
      min-height: 46px;
      font-size: 0.95rem;
    }

    /* ---------- 결과 영역 ---------- */
    .result {
      margin-top: 20px;
    }
    .message {
      background: var(--card);
      border: 2px dashed var(--line);
      border-radius: 24px;
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      font-weight: 600;
    }
    .message .big { font-size: 40px; display: block; margin-bottom: 6px; }
    .message.warn {
      border-color: #ffc9a3;
      color: var(--orange-dark);
      background: #fff3e8;
    }

    .menu-card {
      background: var(--card);
      border-radius: 28px;
      padding: 26px 20px 22px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 3px solid var(--orange);
      animation: pop 0.35s ease-out;
    }
    .menu-card .emoji {
      font-size: 72px;
      line-height: 1.1;
    }
    .menu-card .type {
      display: inline-block;
      margin-top: 8px;
      background: var(--orange-soft);
      color: var(--orange-dark);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 999px;
    }
    .menu-card h2 {
      margin: 8px 0 6px;
      font-size: 1.7rem;
      word-break: keep-all;
    }
    .menu-card .desc {
      margin: 0 0 16px;
      color: var(--muted);
      word-break: keep-all;
    }
    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .info div {
      background: var(--cream);
      border-radius: 16px;
      padding: 10px 8px;
    }
    .info dt {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .info dd {
      margin: 2px 0 0;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .notice {
      margin: 12px 0 0;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--orange-dark);
    }
    .result .actions { margin-top: 14px; }

    .disclaimer {
      margin: 22px 0 0;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
    }

    @keyframes pop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo, .menu-card { animation: none; }
    }

    @media (max-width: 380px) {
      h1 { font-size: 1.5rem; }
      .chip span { padding: 8px 12px; font-size: 0.9rem; }
      .menu-card h2 { font-size: 1.45rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo" aria-hidden="true">🍱</div>
      <h1>오늘 뭐 먹지? 🍽️</h1>
      <p class="subtitle">조건을 고르면 점심 메뉴를 골라 드려요!</p>
    </header>

    <form class="panel" id="filterForm" onsubmit="return false;">
      <fieldset>
        <legend>🍚 음식 종류 <span class="now" id="nowType"></span></legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="type" value="전체" checked><span>전체</span></label>
          <label class="chip"><input type="radio" name="type" value="한식"><span>한식</span></label>
          <label class="chip"><input type="radio" name="type" value="중식"><span>중식</span></label>
          <label class="chip"><input type="radio" name="type" value="일식"><span>일식</span></label>
          <label class="chip"><input type="radio" name="type" value="양식"><span>양식</span></label>
          <label class="chip"><input type="radio" name="type" value="분식"><span>분식</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>💰 최대 예산 <span class="now" id="nowBudget"></span></legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="budget" value="0" checked><span>제한 없음</span></label>
          <label class="chip"><input type="radio" name="budget" value="8000"><span>8,000원</span></label>
          <label class="chip"><input type="radio" name="budget" value="10000"><span>10,000원</span></label>
          <label class="chip"><input type="radio" name="budget" value="15000"><span>15,000원</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>🌶️ 매운 정도 <span class="now" id="nowSpicy"></span></legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="spicy" value="상관없음" checked><span>상관없음</span></label>
          <label class="chip"><input type="radio" name="spicy" value="0"><span>안 매운 음식</span></label>
          <label class="chip"><input type="radio" name="spicy" value="1"><span>살짝 매운 음식</span></label>
          <label class="chip"><input type="radio" name="spicy" value="2"><span>매운 음식</span></label>
        </div>
      </fieldset>

      <div class="actions">
        <button type="button" class="btn btn-main" id="recommendBtn">🍽️ 점심 메뉴 추천받기</button>
        <button type="button" class="btn btn-ghost" id="resetBtn">↺ 조건 초기화</button>
      </div>
    </form>

    <section class="result" id="result" aria-live="polite"></section>

    <p class="disclaimer">※ 가격은 실습용 예시 금액이며 실제 식당 가격과 다를 수 있어요.</p>
  </main>

  <script>
    /* =========================================================
       🍴 메뉴 데이터 목록
       ---------------------------------------------------------
       ✏️ 메뉴를 추가하거나 수정하려면 이 목록(MENUS)을 고치면 돼요!
       한 줄이 메뉴 하나예요. 아래 형식을 그대로 따라 써 주세요.

         { name: "메뉴 이름", type: "음식 종류", emoji: "이모지",
           desc: "짧은 설명", price: 가격(숫자만), spicy: 매운 정도 }

       - type  : "한식", "중식", "일식", "양식", "분식" 중 하나
       - price : 원 단위 숫자 (쉼표 없이! 예: 8500)
       - spicy : 0 = 안 매움, 1 = 살짝 매움, 2 = 매움
       - 줄 끝의 쉼표(,)를 빠뜨리지 않도록 조심하세요.
       ========================================================= */
    const MENUS = [
      // ---------- 🇰🇷 한식 (여기에 한식 메뉴를 추가하세요) ----------
      { name: "김치찌개", type: "한식", emoji: "🍲", desc: "잘 익은 김치와 돼지고기를 푹 끓인 얼큰한 찌개", price: 9000, spicy: 2 },
      { name: "비빔밥", type: "한식", emoji: "🥗", desc: "갖은 나물과 고추장을 슥슥 비벼 먹는 한 그릇", price: 9500, spicy: 1 },
      { name: "된장찌개", type: "한식", emoji: "🥘", desc: "구수한 된장에 두부와 애호박을 넣은 집밥 메뉴", price: 8000, spicy: 0 },
      { name: "제육볶음", type: "한식", emoji: "🍖", desc: "매콤달콤 양념에 볶은 돼지고기와 따끈한 밥", price: 10000, spicy: 2 },
      { name: "갈비탕", type: "한식", emoji: "🍖", desc: "부드러운 갈비가 듬뿍 들어간 맑고 진한 국물", price: 14000, spicy: 0 },
      { name: "불고기 백반", type: "한식", emoji: "🍚", desc: "달큰한 간장 불고기와 반찬이 나오는 든든한 상", price: 11000, spicy: 0 },

      // ---------- 🇨🇳 중식 (여기에 중식 메뉴를 추가하세요) ----------
      { name: "짜장면", type: "중식", emoji: "🍜", desc: "춘장 소스에 쫄깃한 면을 비벼 먹는 국민 메뉴", price: 7000, spicy: 0 },
      { name: "짬뽕", type: "중식", emoji: "🌶️", desc: "해물과 채소를 넣은 얼큰하고 시원한 국물 면", price: 8500, spicy: 2 },
      { name: "볶음밥", type: "중식", emoji: "🍳", desc: "불맛 나게 볶은 밥에 짜장 소스를 곁들인 메뉴", price: 8000, spicy: 0 },
      { name: "마파두부밥", type: "중식", emoji: "🍛", desc: "알싸한 두부 소스를 밥에 얹은 덮밥", price: 9500, spicy: 1 },
      { name: "탕수육 세트", type: "중식", emoji: "🥡", desc: "바삭한 탕수육에 짜장면이 함께 나오는 세트", price: 15000, spicy: 0 },
      { name: "마라탕", type: "중식", emoji: "🥵", desc: "얼얼한 마라 국물에 원하는 재료를 골라 넣는 탕", price: 12000, spicy: 2 },

      // ---------- 🇯🇵 일식 (여기에 일식 메뉴를 추가하세요) ----------
      { name: "돈가스", type: "일식", emoji: "🍱", desc: "겉은 바삭, 속은 촉촉한 두툼한 돼지고기 튀김", price: 10000, spicy: 0 },
      { name: "우동", type: "일식", emoji: "🍜", desc: "탱글한 면발과 따뜻한 가쓰오 국물", price: 7500, spicy: 0 },
      { name: "초밥 세트", type: "일식", emoji: "🍣", desc: "신선한 생선을 올린 초밥 10피스", price: 15000, spicy: 0 },
      { name: "규동", type: "일식", emoji: "🍚", desc: "달짝지근한 소고기와 양파를 올린 덮밥", price: 9000, spicy: 0 },
      { name: "매운 라멘", type: "일식", emoji: "🍥", desc: "진한 돈코츠 육수에 매운 양념을 더한 라멘", price: 11000, spicy: 2 },
      { name: "카레라이스", type: "일식", emoji: "🍛", desc: "살짝 매콤한 일본식 카레를 듬뿍 부은 밥", price: 8500, spicy: 1 },

      // ---------- 🇮🇹 양식 (여기에 양식 메뉴를 추가하세요) ----------
      { name: "크림 파스타", type: "양식", emoji: "🍝", desc: "부드러운 크림소스와 베이컨이 어우러진 파스타", price: 13000, spicy: 0 },
      { name: "아라비아따 파스타", type: "양식", emoji: "🌶️", desc: "페페론치노로 매콤하게 맛을 낸 토마토 파스타", price: 12500, spicy: 2 },
      { name: "수제 햄버거", type: "양식", emoji: "🍔", desc: "두툼한 패티와 치즈가 들어간 버거 세트", price: 9500, spicy: 0 },
      { name: "샌드위치", type: "양식", emoji: "🥪", desc: "햄, 치즈, 채소를 가득 넣은 가벼운 한 끼", price: 7000, spicy: 0 },
      { name: "피자 한 조각 세트", type: "양식", emoji: "🍕", desc: "치즈 듬뿍 피자 두 조각과 음료", price: 8000, spicy: 0 },
      { name: "치킨 부리토", type: "양식", emoji: "🌯", desc: "살짝 매운 살사와 치킨을 또띠아로 감싼 메뉴", price: 10000, spicy: 1 },

      // ---------- 🍢 분식 (여기에 분식 메뉴를 추가하세요) ----------
      { name: "떡볶이", type: "분식", emoji: "🍢", desc: "쫀득한 떡을 매콤달콤한 고추장 소스에 졸인 간식", price: 5000, spicy: 2 },
      { name: "김밥", type: "분식", emoji: "🍙", desc: "햄, 단무지, 계란이 들어간 기본 김밥 한 줄", price: 4000, spicy: 0 },
      { name: "라볶이", type: "분식", emoji: "🍜", desc: "떡볶이에 라면 사리를 더한 든든한 메뉴", price: 6500, spicy: 1 },
      { name: "순대 세트", type: "분식", emoji: "🌭", desc: "순대와 간, 허파를 함께 즐기는 분식 세트", price: 6000, spicy: 0 },
      { name: "쫄면", type: "분식", emoji: "🥢", desc: "쫄깃한 면에 새콤매콤한 양념을 비빈 면 요리", price: 7000, spicy: 2 },
      { name: "돈가스 김밥 세트", type: "분식", emoji: "🍱", desc: "돈가스 김밥에 어묵 국물이 함께 나오는 세트", price: 8500, spicy: 0 },
    ];

    // 매운 정도 숫자를 화면에 보여줄 글자로 바꿔요.
    const SPICY_LABELS = ["안 매움 😌", "살짝 매움 🌶️", "매움 🌶️🌶️🌶️"];

    // ---------- 화면 요소 ----------
    const form = document.getElementById("filterForm");
    const resultEl = document.getElementById("result");
    const recommendBtn = document.getElementById("recommendBtn");
    const resetBtn = document.getElementById("resetBtn");

    // 직전에 추천한 메뉴 (다시 추천할 때 제외하려고 기억해요)
    let lastMenu = null;

    // 지금 선택된 조건을 읽어요.
    function getFilters() {
      return {
        type: form.elements.type.value,
        budget: Number(form.elements.budget.value),   // 0이면 제한 없음
        spicy: form.elements.spicy.value,              // "상관없음" 또는 "0","1","2"
      };
    }

    // 조건을 모두 만족하는 메뉴만 골라요.
    function getCandidates(f) {
      return MENUS.filter((menu) => {
        const typeOk = f.type === "전체" || menu.type === f.type;
        const budgetOk = f.budget === 0 || menu.price <= f.budget;
        const spicyOk = f.spicy === "상관없음" || menu.spicy === Number(f.spicy);
        return typeOk && budgetOk && spicyOk;
      });
    }

    function formatPrice(n) {
      return n.toLocaleString("ko-KR") + "원";
    }

    // 현재 선택 상태를 각 조건 제목 옆에 표시해요.
    function updateNowLabels() {
      const checkedText = (name) =>
        form.querySelector(`input[name="${name}"]:checked`).nextElementSibling.textContent;
      document.getElementById("nowType").textContent = checkedText("type");
      document.getElementById("nowBudget").textContent = checkedText("budget");
      document.getElementById("nowSpicy").textContent = checkedText("spicy");
    }

    function showMessage(emoji, text, isWarn) {
      resultEl.innerHTML = "";
      const box = document.createElement("div");
      box.className = "message" + (isWarn ? " warn" : "");
      const big = document.createElement("span");
      big.className = "big";
      big.textContent = emoji;
      box.append(big, text);
      resultEl.append(box);
    }

    function showMenu(menu, onlyOne) {
      resultEl.innerHTML = `
        <article class="menu-card">
          <div class="emoji" aria-hidden="true"></div>
          <span class="type"></span>
          <h2></h2>
          <p class="desc"></p>
          <dl class="info">
            <div><dt>예상 가격</dt><dd class="price"></dd></div>
            <div><dt>매운 정도</dt><dd class="spicy"></dd></div>
          </dl>
          ${onlyOne ? '<p class="notice">조건에 맞는 메뉴가 하나예요.</p>' : ""}
        </article>
        <div class="actions">
          <button type="button" class="btn btn-sub" id="againBtn">🔄 다시 추천</button>
        </div>`;
      // 메뉴 글자는 textContent로 넣어서 안전하게 표시해요.
      resultEl.querySelector(".emoji").textContent = menu.emoji;
      resultEl.querySelector(".type").textContent = menu.type;
      resultEl.querySelector("h2").textContent = menu.name;
      resultEl.querySelector(".desc").textContent = menu.desc;
      resultEl.querySelector(".price").textContent = formatPrice(menu.price);
      resultEl.querySelector(".spicy").textContent = SPICY_LABELS[menu.spicy];
      document.getElementById("againBtn").addEventListener("click", recommend);
    }

    // 추천하기 (처음 추천과 다시 추천 모두 이 함수를 써요)
    function recommend() {
      const candidates = getCandidates(getFilters());

      if (candidates.length === 0) {
        lastMenu = null;
        showMessage("🥲", "조건에 맞는 메뉴가 없어요. 예산이나 다른 조건을 바꿔보세요.", true);
        return;
      }

      if (candidates.length === 1) {
        lastMenu = candidates[0];
        showMenu(candidates[0], true);
        return;
      }

      // 직전 메뉴는 빼고 무작위로 하나 골라요.
      const pool = candidates.filter((menu) => menu !== lastMenu);
      const picked = pool[Math.floor(Math.random() * pool.length)];
      lastMenu = picked;
      showMenu(picked, false);
    }

    function showWelcome() {
      showMessage("🤔", "조건을 고르고 ‘점심 메뉴 추천받기’를 눌러 보세요!", false);
    }

    // 조건이 바뀌면 이전 결과 대신 안내 문구를 보여줘요.
    form.addEventListener("change", () => {
      lastMenu = null;
      updateNowLabels();
      showMessage("🔁", "조건이 바뀌었어요. 다시 추천받아 보세요.", false);
    });

    recommendBtn.addEventListener("click", recommend);

    // 조건 초기화: 기본 선택(전체 · 제한 없음 · 상관없음)으로 돌아가요.
    resetBtn.addEventListener("click", () => {
      form.reset();
      lastMenu = null;
      updateNowLabels();
      showWelcome();
    });

    updateNowLabels();
    showWelcome();
  </script>
</body>
</html>
